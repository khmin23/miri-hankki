<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#fff8ef 0%,#f0f9ff 48%,#fff5e8 100%);color:#102033;overflow:hidden;}
.viewer{position:relative;margin:10px;border-radius:24px;overflow:hidden;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.88);box-shadow:0 18px 46px rgba(16,32,51,.14);backdrop-filter:blur(18px);}
.video-stage{position:relative;background:#000;}
video{display:block;width:100%;height:360px;object-fit:cover;}
.video-badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.92);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;color:#8B5E34;pointer-events:none;box-shadow:0 6px 18px rgba(16,32,51,.14);backdrop-filter:blur(12px);}
.info{padding:14px 16px 16px;background:rgba(255,255,255,.78);backdrop-filter:blur(16px);}
.shop-tag{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:#fff4e8;color:#8B5E34;font-size:11px;font-weight:800;letter-spacing:.03em;margin-bottom:8px;}
.shop-name{font-size:21px;font-weight:900;color:#102033;letter-spacing:-.02em;}
.shop-sub{font-size:12px;color:#66788a;margin-top:3px;font-weight:600;}
</style>
</head>
<body>
<div class="viewer">
  <div class="video-stage">
    <video autoplay muted loop playsinline>
      <source src="./casabusano-interior.mp4" type="video/mp4">
    </video>
    <div class="video-badge">🎬 가게 내부 영상</div>
  </div>
  <div class="info">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;">
      <div>
        <div class="shop-tag">에스프레소 바</div>
        <div class="shop-name">까사부사노</div>
        <div class="shop-sub">부산 · 광안리 · 오션뷰 에스프레소 카페</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
